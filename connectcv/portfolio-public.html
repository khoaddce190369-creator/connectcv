<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Cá Nhân — ConnectCV</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            neutral: {
              850: '#1f1f1f',
              900: '#171717',
              950: '#0a0a0a',
            }
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },
            }
          },
          animation: {
            'fade-up': 'fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite',
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-font-smoothing: antialiased; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }

    .glass-dock {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(229, 231, 235, 0.8);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .dark .glass-dock {
      background: rgba(23, 23, 23, 0.88);
      border: 1px solid rgba(64, 64, 64, 0.6);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .card-clean {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-clean:hover {
      transform: translateY(-2px);
    }

    /* Tactile Gradient Button Styles */
    .btn-tactile-blue {
      background: linear-gradient(to top, #2563eb, #3b82f6) !important;
      border: 1px solid rgba(96, 165, 250, 0.6) !important;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.35) !important;
      color: #ffffff !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-tactile-blue:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-tactile-blue:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-[#fafafa] dark:bg-[#0a0a0a] text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col font-sans selection:bg-neutral-900 selection:text-white dark:selection:bg-white dark:selection:text-black transition-colors duration-300 pb-28">

  <!-- ==================== TOP STANDALONE LANDING NAVBAR ==================== -->
  <header class="w-full sticky top-0 z-40 bg-white/80 dark:bg-neutral-950/80 backdrop-blur-md border-b border-neutral-200/70 dark:border-neutral-800/80 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      
      <!-- Left: Logo & Subdomain -->
      <div class="flex items-center gap-3 shrink-0">
        <a href="/" class="group flex items-center gap-2 text-xs font-bold text-neutral-900 dark:text-neutral-100 transition-colors">
          <div class="w-7 h-7 rounded-lg bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 flex items-center justify-center font-bold text-xs shadow-2xs">
            CV
          </div>
          <span class="hidden sm:inline font-heading font-extrabold text-sm tracking-tight">ConnectCV</span>
        </a>
        <span class="text-neutral-300 dark:text-neutral-700 hidden sm:inline">/</span>
        <button onclick="copySubdomainUrl()" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-neutral-100 dark:bg-neutral-800/90 text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white text-xs font-mono transition-colors" title="Bấm để sao chép link công khai">
          <span id="navSubdomainLabel">p/tuan-nguyen</span>
          <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184"/></svg>
        </button>
      </div>

      <!-- Center: Template Switcher Pills (4 Modern Popular Templates) -->
      <div class="hidden md:flex items-center gap-1 p-1 bg-neutral-100 dark:bg-neutral-900 rounded-full border border-neutral-200/80 dark:border-neutral-800 text-xs">
        <button onclick="setTemplate('bento')" id="btnTpl-bento" class="px-3 py-1 rounded-full text-xs font-medium transition-all cursor-pointer">
          Bento Grid
        </button>
        <button onclick="setTemplate('magic')" id="btnTpl-magic" class="px-3 py-1 rounded-full text-xs font-medium transition-all cursor-pointer">
          Minimalist
        </button>
        <button onclick="setTemplate('showcase')" id="btnTpl-showcase" class="px-3 py-1 rounded-full text-xs font-medium transition-all cursor-pointer">
          Creative Studio
        </button>
        <button onclick="setTemplate('terminal')" id="btnTpl-terminal" class="px-3 py-1 rounded-full text-xs font-medium transition-all cursor-pointer">
          Dev Terminal
        </button>
      </div>

      <!-- Right: Chỉnh sửa, Theme & Action -->
      <div class="flex items-center gap-2">
        <!-- Nút Chỉnh Sửa Hồ Sơ -->
        <button onclick="openCustomizerModal('profile')" class="btn-tactile-blue px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/></svg>
          <span>Chỉnh Sửa</span>
        </button>

        <!-- Đổi Dark / Light mode -->
        <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-xl flex items-center justify-center border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition-colors cursor-pointer" title="Đổi giao diện Sáng / Tối">
          <svg id="themeIconSun" class="w-4 h-4 hidden dark:block fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
          <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden fill-current" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
        </button>
      </div>

    </div>

    <!-- Mobile Template Selector Bar -->
    <div class="flex md:hidden items-center justify-center gap-1 py-1.5 px-3 border-t border-neutral-100 dark:border-neutral-900 bg-neutral-50 dark:bg-neutral-900/60 overflow-x-auto text-[11px]">
      <button onclick="setTemplate('bento')" id="btnTplMobile-bento" class="px-2.5 py-0.5 rounded-full font-medium whitespace-nowrap">Bento</button>
      <button onclick="setTemplate('magic')" id="btnTplMobile-magic" class="px-2.5 py-0.5 rounded-full font-medium whitespace-nowrap">Minimal</button>
      <button onclick="setTemplate('showcase')" id="btnTplMobile-showcase" class="px-2.5 py-0.5 rounded-full font-medium whitespace-nowrap">Showcase</button>
      <button onclick="setTemplate('terminal')" id="btnTplMobile-terminal" class="px-2.5 py-0.5 rounded-full font-medium whitespace-nowrap">Terminal</button>
    </div>
  </header>

  <!-- ==================== DYNAMIC LANDING PAGE CONTAINER ==================== -->
  <main id="portfolioMainContainer" class="w-full flex-1 transition-all duration-300">
    <!-- Rendered dynamically via renderAll() based on currentTemplate -->
  </main>

  <!-- ==================== FLOATING GLASS DOCK (QUICK ACTIONS) ==================== -->
  <aside class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40">
    <div class="glass-dock rounded-full px-3 py-1.5 flex items-center gap-1 sm:gap-2 shadow-lg">
      
      <!-- Home -->
      <a href="#about" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all hover:scale-110 active:scale-95" title="Đầu trang">
        <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
      </a>

      <!-- Projects -->
      <a href="#projects" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all hover:scale-110 active:scale-95" title="Dự án">
        <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      </a>

      <!-- GitHub -->
      <a id="dockGithubLink" href="https://github.com" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all hover:scale-110 active:scale-95" title="GitHub">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>

      <!-- Divider -->
      <span class="w-[1px] h-4 bg-neutral-200 dark:bg-neutral-800 my-auto"></span>

      <!-- Nút Chỉnh Sửa Modal -->
      <button onclick="openCustomizerModal('profile')" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all hover:scale-110 active:scale-95" title="Tùy biến hồ sơ">
        <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"/></svg>
      </button>

      <!-- Email Contact -->
      <a id="dockContactEmail" href="mailto:contact@connectcv.vn" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all hover:scale-110 active:scale-95" title="Gửi Email">
        <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
      </a>

    </div>
  </aside>

  <!-- ==================== MODAL: QUẢN LÝ & CHỈNH SỬA TÙNG PHẦN (CUSTOMIZER) ==================== -->
  <div id="modalCustomizer" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 overflow-y-auto" onclick="if(event.target === this) closeCustomizerModal()">
    <div class="bg-white dark:bg-neutral-900 rounded-2xl max-w-xl w-full p-5 sm:p-6 space-y-5 border border-neutral-200 dark:border-neutral-800 shadow-2xl animate-fade-up text-xs text-neutral-800 dark:text-neutral-200 max-h-[92vh] overflow-y-auto">
      
      <!-- Top Title -->
      <div class="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-800 pb-3">
        <div>
          <h3 class="font-heading font-bold text-sm text-neutral-900 dark:text-white">Tùy Biến Portfolio</h3>
          <p class="text-[11px] text-neutral-400">Chỉnh sửa nội dung từng phần hiển thị trên portfolio landing page của bạn.</p>
        </div>
        <button onclick="closeCustomizerModal()" class="text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200 text-xl leading-none cursor-pointer">&times;</button>
      </div>

      <!-- Navigation Tabs Inside Modal -->
      <div class="flex items-center gap-1.5 border-b border-neutral-100 dark:border-neutral-800 pb-2 text-xs font-medium overflow-x-auto">
        <button onclick="switchCustomTab('profile')" id="custTabBtn-profile" class="px-3 py-1.5 rounded-lg bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 font-semibold transition-all">
          1. Thông Tin
        </button>
        <button onclick="switchCustomTab('experience')" id="custTabBtn-experience" class="px-3 py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-all">
          2. Kinh Nghiệm
        </button>
        <button onclick="switchCustomTab('education')" id="custTabBtn-education" class="px-3 py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-all">
          3. Học Vấn
        </button>
        <button onclick="switchCustomTab('skills')" id="custTabBtn-skills" class="px-3 py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-all">
          4. Kỹ Năng
        </button>
        <button onclick="switchCustomTab('projects')" id="custTabBtn-projects" class="px-3 py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-all">
          5. Dự Án
        </button>
      </div>

      <!-- TAB 1: THÔNG TIN CÁ NHÂN -->
      <div id="custTab-profile" class="space-y-3.5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Họ và Tên (*):</label>
            <input id="inpCustName" type="text" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white" />
          </div>
          <div>
            <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Chức Danh / Vị Trí (*):</label>
            <input id="inpCustRole" type="text" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Địa Điểm / Thành Phố:</label>
            <input id="inpCustLocation" type="text" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white" />
          </div>
          <div>
            <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Định Danh Đường Dẫn (Slug):</label>
            <div class="flex items-center border border-neutral-200 dark:border-neutral-700 rounded-lg px-2.5 py-1.5 bg-neutral-50 dark:bg-neutral-800">
              <span class="text-neutral-400 font-mono text-[10px]">connectcv.vn/p/</span>
              <input id="inpCustSubdomain" type="text" class="bg-transparent font-mono font-medium outline-none flex-1 text-xs ml-1" />
            </div>
          </div>
        </div>

        <div>
          <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Ảnh Đại Diện (Avatar URL):</label>
          <div class="flex gap-1.5">
            <input id="inpCustAvatar" type="text" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white flex-1" />
            <button type="button" onclick="cycleCustAvatar()" class="px-2.5 py-1.5 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 rounded-lg font-medium whitespace-nowrap">Ảnh Mẫu</button>
          </div>
        </div>

        <div>
          <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Giới Thiệu Bản Thân (Bio):</label>
          <textarea id="inpCustBio" rows="3" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white leading-relaxed"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-neutral-100 dark:border-neutral-800">
          <div>
            <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">GitHub Username:</label>
            <input id="inpCustGithub" type="text" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white" placeholder="VD: tuannguyen-dev" />
          </div>
          <div>
            <label class="block font-medium text-neutral-700 dark:text-neutral-300 mb-1">Email Liên Hệ:</label>
            <input id="inpCustEmail" type="email" class="w-full px-3 py-2 bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-white" placeholder="contact@domain.com" />
          </div>
        </div>
      </div>

      <!-- TAB 2: KINH NGHIỆM -->
      <div id="custTab-experience" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <span class="font-medium text-neutral-500">Danh sách kinh nghiệm:</span>
          <button type="button" onclick="addExperienceRow()" class="px-2.5 py-1 rounded bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 text-neutral-800 dark:text-white font-semibold text-xs flex items-center gap-1 cursor-pointer">

      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // 2. Parse subdomain từ URL
      const pathParts = window.location.pathname.split('/');
      let sub = pathParts[pathParts.length - 1];
      if (!sub || sub === 'portfolio-public.html' || sub === 'p' || sub === 'portfolio') {
        const urlParams = new URLSearchParams(window.location.search);
        sub = urlParams.get('u');
      }

      if (!sub) {
        try {
          const stored = localStorage.getItem('connectcv_user');
          if (stored) {
            const u = JSON.parse(stored);
            if (u && u.subdomain) sub = u.subdomain;
          }
        } catch (e) {}
      }

      currentSubdomain = sub || 'tuan-nguyen';
      const navLabel = document.getElementById('navSubdomainLabel');
      if (navLabel) navLabel.innerText = `p/${currentSubdomain}`;

      // 3. Phục hồi template từ query parameter hoặc localStorage
      const urlParams = new URLSearchParams(window.location.search);
      const tplParam = urlParams.get('tpl');
      const savedTpl = tplParam || localStorage.getItem('portfolio_template') || 'bento';

      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    // --- TEMPLATE SWITCHER ---
    function setTemplate(tpl, notify = true) {
      currentTemplate = tpl;
      localStorage.setItem('portfolio_template', tpl);
      updateTemplatePillState(tpl);
      renderAll();

      // Cập nhật URL mà không reload trang
      const url = new URL(window.location);
      url.searchParams.set('tpl', tpl);
      window.history.replaceState({}, '', url);

      if (notify) {
        const names = {
          bento: 'Bento Grid Modern',
          magic: 'Minimalist Editorial',
          showcase: 'Creative Studio Showcase',
          terminal: 'Developer Terminal'
        };
        showToast(`Đã chuyển sang mẫu: ${names[tpl] || tpl}`);
      }
    }

    function updateTemplatePillState(tpl) {
      const tpls = ['bento', 'magic', 'showcase', 'terminal'];
      tpls.forEach(t => {
        const desktopBtn = document.getElementById(`btnTpl-${t}`);
        const mobileBtn = document.getElementById(`btnTplMobile-${t}`);

        if (desktopBtn) {

        container.innerHTML = renderTerminalTemplate();

                      <div class="flex gap-2 shrink-0">
                        ${p.demoUrl ? `<a href="${p.demoUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">./run_demo &rarr;</a>` : ''}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Command: ./contact.sh -->
              <div class="space-y-2" id="contact">
                <p class="text-emerald-400"><span class="text-blue-400">guest@connectcv</span>:<span class="text-purple-400">~</span>$ ./contact.sh</p>
                <div class="pl-4 space-y-1 text-neutral-300">
                  <p>Email: <a href="mailto:${currentProfile.email}" class="text-blue-400 underline">${currentProfile.email}</a></p>
                  <p>GitHub: <a href="https://github.com/${currentProfile.githubUsername || 'facebook'}" class="text-blue-400 underline">github.com/${currentProfile.githubUsername || 'dev'}</a></p>
                </div>
              </div>

              <!-- Interactive Prompt -->
              <div class="flex items-center gap-2 pt-2">
                <span class="text-blue-400">guest@connectcv</span>:<span class="text-purple-400">~</span>$
                <span class="w-2 h-4 bg-emerald-400 animate-pulse"></span>
              </div>

            </div>
          </div>

        </div>
      `;
    }

    // --- MODAL SECTION CUSTOMIZER LOGIC ---
    function openCustomizerModal(tab = 'profile') {
      document.getElementById('inpCustName').value = currentProfile?.name || '';
      document.getElementById('inpCustRole').value = currentProfile?.role || '';
      document.getElementById('inpCustLocation').value = currentProfile?.location || 'Việt Nam';
      document.getElementById('inpCustSubdomain').value = currentProfile?.subdomain || currentSubdomain;
      document.getElementById('inpCustAvatar').value = currentProfile?.avatar || '';
      document.getElementById('inpCustBio').value = currentProfile?.bio || '';
      document.getElementById('inpCustGithub').value = currentProfile?.githubUsername || '';
      document.getElementById('inpCustEmail').value = currentProfile?.email || '';
      document.getElementById('inpCustSkills').value = (currentProfile?.skills || []).join(', ');

      renderCustExpList();
      renderCustEduList();
      renderCustProjList();

      switchCustomTab(tab);
      document.getElementById('modalCustomizer').classList.remove('hidden');
    }

    function closeCustomizerModal() {
      document.getElementById('modalCustomizer').classList.add('hidden');
    }

    function switchCustomTab(tabName) {
      ['profile', 'experience', 'education', 'skills', 'projects'].forEach(t => {
        const btn = document.getElementById(`custTabBtn-${t}`);
        const pane = document.getElementById(`custTab-${t}`);
        if (t === tabName) {
          btn.className = 'px-3 py-1.5 rounded-lg bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 font-semibold transition-all';
          pane.classList.remove('hidden');
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-all';
          pane.classList.add('hidden');
        }
      });
    }

    function cycleCustAvatar() {
      sampleAvtIdx = (sampleAvtIdx + 1) % SAMPLE_AVATARS.length;
      document.getElementById('inpCustAvatar').value = SAMPLE_AVATARS[sampleAvtIdx];
    }

    // Experience CRUD in Modal
    function renderCustExpList() {
      const container = document.getElementById('custExpList');
      if (currentExperiences.length === 0) {
        container.innerHTML = '<p class="text-xs text-neutral-400">Chưa có mục nào. Hãy bấm "Thêm Mục Mới" phía trên.</p>';
        return;
      }
      container.innerHTML = currentExperiences.map((exp, idx) => `
        <div class="p-3 rounded-lg border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 space-y-2">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-neutral-900 dark:text-white">Kinh nghiệm #${idx + 1}</span>
            <button type="button" onclick="removeExperienceRow(${idx})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Xóa</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${exp.title}" oninput="currentExperiences[${idx}].title = this.value" placeholder="Vị trí (VD: Fullstack Developer)" class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs" />
            <input type="text" value="${exp.company}" oninput="currentExperiences[${idx}].company = this.value" placeholder="Tên công ty" class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs" />
          </div>
          <input type="text" value="${exp.period}" oninput="currentExperiences[${idx}].period = this.value" placeholder="Thời gian (VD: 2024 — Nay)" class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs" />
          <textarea rows="2" oninput="currentExperiences[${idx}].description = this.value" placeholder="Mô tả công việc..." class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs">${exp.description || ''}</textarea>
        </div>
      `).join('');
    }

    function addExperienceRow() {
      currentExperiences.unshift({
        title: 'Senior Software Developer',
        company: 'Doanh Nghiệp Đối Tác',
        period: '2025 — Nay',
        description: 'Mô tả đóng góp chuyên môn và kết quả sản phẩm.'
      });
      renderCustExpList();
    }

    function removeExperienceRow(idx) {
      currentExperiences.splice(idx, 1);
      renderCustExpList();
    }

    // Education CRUD in Modal
    function renderCustEduList() {
      const container = document.getElementById('custEduList');
      if (currentEducations.length === 0) {
        container.innerHTML = '<p class="text-xs text-neutral-400">Chưa có thông tin học vấn.</p>';
        return;
      }
      container.innerHTML = currentEducations.map((edu, idx) => `
        <div class="p-3 rounded-lg border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 space-y-2">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-neutral-900 dark:text-white">Trường #${idx + 1}</span>
            <button type="button" onclick="removeEducationRow(${idx})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Xóa</button>
          </div>
          <input type="text" value="${edu.school}" oninput="currentEducations[${idx}].school = this.value" placeholder="Tên trường (VD: ĐH FPT)" class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs" />
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${edu.degree}" oninput="currentEducations[${idx}].degree = this.value" placeholder="Bằng cấp / Ngành" class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs" />
            <input type="text" value="${edu.period}" oninput="currentEducations[${idx}].period = this.value" placeholder="Niên khóa (VD: 2020 — 2024)" class="w-full px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded text-xs" />
          </div>
        </div>
      `).join('');
    }

    function addEducationRow() {
      currentEducations.unshift({
        school: 'Đại Học Công Nghệ',
        degree: 'Kỹ sư Kỹ thuật Phần mềm',
        period: '2021 — 2025'
      });
      renderCustEduList();
    }

    function removeEducationRow(idx) {
      currentEducations.splice(idx, 1);
      renderCustEduList();
    }

    // Projects CRUD in Modal
    function renderCustProjList() {
      const container = document.getElementById('custProjList');
      if (currentProjects.length === 0) {
        container.innerHTML = '<p class="text-xs text-neutral-400">Chưa có dự án nào.</p>';
        return;
      }
      container.innerHTML = currentProjects.map((p, idx) => `
        <div class="p-2.5 rounded-lg border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2.5 truncate">
            <img src="${p.image || 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=100'}" class="w-8 h-8 rounded object-cover shrink-0" />
            <div class="truncate">
              <p class="font-semibold text-neutral-900 dark:text-white truncate">${p.title}</p>
              <p class="text-[11px] text-neutral-400 truncate">${(p.tags || []).join(', ')}</p>
            </div>
          </div>
          <button type="button" onclick="removeProject(${idx})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold shrink-0 cursor-pointer">Xóa</button>
        </div>
      `).join('');
    }

    function submitQuickProject() {
      const title = document.getElementById('inpNewPTitle').value.trim();
      const image = document.getElementById('inpNewPImage').value.trim();
      const demoUrl = document.getElementById('inpNewPDemo').value.trim();
      const githubUrl = document.getElementById('inpNewPGithub').value.trim();
      const tagsStr = document.getElementById('inpNewPTags').value.trim();
      const desc = document.getElementById('inpNewPDesc').value.trim();

      if (!title || !image) {
        alert('Vui lòng nhập tiêu đề dự án và link ảnh bìa.');
        return;
      }

      const newProj = {
        id: `p_${Date.now()}`,
        title,
        image,
        demoUrl,
        githubUrl,
        tags: tagsStr ? tagsStr.split(',').map(s => s.trim()).filter(Boolean) : ['React'],
        description: desc || 'Dự án thực tế chứng minh năng lực.'
      };

      currentProjects.unshift(newProj);
      renderCustProjList();

      document.getElementById('inpNewPTitle').value = '';
      document.getElementById('inpNewPImage').value = '';
      document.getElementById('inpNewPDemo').value = '';
      document.getElementById('inpNewPGithub').value = '';
      document.getElementById('inpNewPTags').value = '';
      document.getElementById('inpNewPDesc').value = '';
      showToast('Đã thêm dự án mới vào danh sách!');
    }

    function removeProject(idx) {
      currentProjects.splice(idx, 1);
      renderCustProjList();
    }

    // SAVE ALL CUSTOMIZATIONS
    async function saveAllCustomizations() {
      const name = document.getElementById('inpCustName').value.trim();
      const role = document.getElementById('inpCustRole').value.trim();
      const location = document.getElementById('inpCustLocation').value.trim();
      const subdomain = document.getElementById('inpCustSubdomain').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      const avatar = document.getElementById('inpCustAvatar').value.trim();
      const bio = document.getElementById('inpCustBio').value.trim();
      const githubUsername = document.getElementById('inpCustGithub').value.trim();
      const email = document.getElementById('inpCustEmail').value.trim();
      const rawSkills = document.getElementById('inpCustSkills').value.trim();
      const skills = rawSkills ? rawSkills.split(',').map(s => s.trim()).filter(Boolean) : ['TypeScript', 'React'];

      if (!name || !role) {
        alert('Họ tên và chức danh không được để trống.');
        return;
      }

      currentProfile = {
        name,
        role,
        location: location || 'Việt Nam',
        subdomain: subdomain || currentSubdomain,
        avatar: avatar || currentProfile?.avatar,
        bio,
        githubUsername,
        email,
        skills
      };

      if (subdomain && subdomain !== currentSubdomain) {
        currentSubdomain = subdomain;
        window.history.pushState(null, '', `/p/${subdomain}`);
        const navLabel = document.getElementById('navSubdomainLabel');
        if (navLabel) navLabel.innerText = `p/${currentSubdomain}`;
      }

      const fullCustomData = {
        profile: currentProfile,
        projects: currentProjects,
        experiences: currentExperiences,
        educations: currentEducations
      };

      localStorage.setItem(`portfolio_custom_${currentSubdomain}`, JSON.stringify(fullCustomData));
      localStorage.setItem('connectcv_portfolio_created', 'true');

      try {
        const userStored = localStorage.getItem('connectcv_user');
        if (userStored) {
          const u = JSON.parse(userStored);
          u.fullName = name;
          u.title = role;
          u.subdomain = currentSubdomain;
          u.avatar = avatar;
          u.github = githubUsername;
          u.portfolioCreated = true;
          localStorage.setItem('connectcv_user', JSON.stringify(u));
        }
      } catch (e) {}

      renderAll();
      closeCustomizerModal();
      showToast('Đã lưu và cập nhật toàn bộ Portfolio!');
    }

    function copySubdomainUrl() {
      const url = `https://connectcv.vn/p/${currentSubdomain}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Đã sao chép link: ' + url);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const m = document.getElementById('toastMsg');
      if (!t || !m) return;
      m.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => { t.classList.add('hidden'); }, 3000);
    }
  </script>
</body>
</html>
