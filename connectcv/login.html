<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập &amp; Đăng ký — ConnectCV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          },
          colors: {
            brand: {
              cyan: '#00d2f7',
              cyanHover: '#00c1e4',
              sky: '#0284c7',
              navy: '#0f172a'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/brand.css" />
  <!-- Google Identity Services (GSI) SDK Chính Thức -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #fbfdff;
      overflow-x: hidden;
    }

    /* Vòng tròn quỹ đạo xoay (Floo Orbit Arcs) */
    @keyframes orbitRotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitRotateReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .animate-orbit-cw {
      transform-origin: 50% 50%;
      animation: orbitRotateSlow 28s linear infinite;
    }
    .animate-orbit-ccw {
      transform-origin: 50% 50%;
      animation: orbitRotateReverse 36s linear infinite;
    }

    /* Floo Input Focus Styling */
    .floo-input {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid #e5e7eb;
      background-color: #ffffff;
    }
    .floo-input:focus, .floo-input:focus-within {
      border-color: #00d2f7 !important;
      box-shadow: 0 0 0 4px rgba(0, 210, 247, 0.18) !important;
      outline: none !important;
    }

    /* Nút Cyan Radiance Floo */
    .btn-floo-cyan {
      background: linear-gradient(135deg, #00daf7 0%, #00c2f8 50%, #0099f7 100%);
      box-shadow: 0 10px 25px -5px rgba(0, 210, 247, 0.4), 0 8px 10px -6px rgba(0, 210, 247, 0.25);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-floo-cyan:hover {
      filter: brightness(1.05);
      box-shadow: 0 14px 28px -4px rgba(0, 210, 247, 0.5), 0 10px 14px -6px rgba(0, 210, 247, 0.35);
      transform: translateY(-1px);
    }
    .btn-floo-cyan:active {
      transform: scale(0.99) translateY(0);
      filter: brightness(0.98);
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between text-neutral-800 select-none">

  <!-- ========================================== -->
  <!-- FLOO CONCENTRIC RADAR & ORBIT BACKGROUND  -->
  <!-- ========================================== -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center">
    <!-- Ambient Radial Glow Gradients -->
    <div class="absolute -top-[10%] -right-[5%] w-[600px] h-[600px] bg-sky-200/35 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-[15%] -left-[10%] w-[700px] h-[700px] bg-cyan-100/40 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[900px] bg-white/70 rounded-full blur-2xl"></div>

    <!-- SVG Radar Rings & Rotating Arcs -->
    <svg class="w-[1400px] h-[1400px] sm:w-[1600px] sm:h-[1600px] flex-shrink-0" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Arc 1 Gradient: Cyan -> Sky -->
        <linearGradient id="arcCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00d2f7" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
        </linearGradient>
        <!-- Arc 2 Gradient: Sky -> Indigo -->
        <linearGradient id="arcIndigoGrad" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
          <stop offset="70%" stop-color="#6366f1" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Static Concentric Rings -->
      <circle cx="500" cy="500" r="160" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.75" />
      <circle cx="500" cy="500" r="255" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="500" cy="500" r="365" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.65" />
      <circle cx="500" cy="500" r="485" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="500" cy="500" r="620" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="500" cy="500" r="780" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.3" />

      <!-- Rotating Arc Group 1 (Clockwise) -->
      <g class="animate-orbit-cw">
        <!-- Vòng cung phát sáng trên bán kính r=255 -->
        <circle cx="500" cy="500" r="255" stroke="url(#arcCyanGrad)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="240 1360" />
        <!-- Vòng cung phát sáng trên bán kính r=485 -->
        <circle cx="500" cy="500" r="485" stroke="url(#arcIndigoGrad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="320 2720" stroke-dashoffset="-400" />
      </g>

      <!-- Rotating Arc Group 2 (Counter-Clockwise) -->
      <g class="animate-orbit-ccw">
        <!-- Vòng cung rực rỡ ngoài xa r=365 -->
        <circle cx="500" cy="500" r="365" stroke="url(#arcCyanGrad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="200 2100" stroke-dashoffset="-900" />
      </g>
    </svg>
  </div>

  <!-- ========================================== -->
  <!-- TOP NAVIGATION BAR (FLOO HEADER)           -->
  <!-- ========================================== -->
  <header class="relative z-10 w-full px-6 sm:px-10 py-6 flex items-center justify-between">
    <!-- Brand Logo -->
    <a href="/" class="flex items-center gap-2.5 group">
      <img src="assets/logo.png" alt="ConnectCV" class="h-8 w-auto group-hover:scale-105 transition-transform" />
      <span class="font-heading font-extrabold text-xl text-neutral-950 tracking-tight">
        connect<span class="text-cyan-500 font-black">cv</span>
      </span>
    </a>

    <!-- Top Right Toggle Pill -->
    <div class="flex items-center gap-2.5 sm:gap-3 text-xs sm:text-sm">
      <span id="navQuestionText" class="text-neutral-500 hidden sm:inline">Chưa có tài khoản?</span>
      <button 
        type="button" 
        onclick="toggleAuthMode()" 
        id="btnNavToggle"
        class="bg-white/90 backdrop-blur-sm border border-neutral-200/90 hover:border-neutral-300 text-neutral-800 font-semibold px-4 py-2 sm:px-5 sm:py-2.5 rounded-full shadow-xs hover:shadow-sm active:scale-95 transition-all flex items-center gap-1.5"
      >
        <span id="btnNavToggleText">Đăng ký ngay</span>
        <svg class="w-3.5 h-3.5 text-neutral-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- MAIN AUTH CONTAINER (FLOO SIGN-IN / SIGN-UP) -->
  <!-- ========================================== -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-[400px]">

      <!-- Floo Squircle App Icon Badge -->
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-white border border-neutral-200/90 shadow-md shadow-neutral-900/5 flex items-center justify-center p-2.5 ring-1 ring-neutral-100">
          <img src="assets/logo.png" alt="ConnectCV" class="w-full h-full object-contain" />
        </div>
      </div>

      <!-- Heading & Subtitle -->
      <div class="text-center mb-8">
        <h1 id="authMainTitle" class="font-heading text-3xl sm:text-[34px] font-extrabold text-neutral-900 tracking-tight leading-tight">
          Chào mừng bạn trở lại.
        </h1>
        <p id="authMainSubtitle" class="text-neutral-500 text-sm sm:text-[15px] mt-1.5 font-normal">
          Hành trình sự nghiệp mới đang chờ đón bạn.
        </p>
      </div>

      <!-- VIEW 1: SIGN IN (ĐĂNG NHẬP) -->
      <div id="sectionLogin" class="space-y-4">
        <form onsubmit="handleLoginSubmit(event)" class="space-y-3.5">
          <!-- Email Input -->
          <div class="floo-input rounded-2xl flex items-center px-4 py-3.5 gap-3">
            <svg class="w-4 h-4 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input 
              id="loginEmail" 
              type="email" 
              required 
              autocomplete="email"
              placeholder="Địa chỉ Email" 
              class="w-full bg-transparent text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none"
            />
          </div>

          <!-- Password Input -->
          <div class="floo-input rounded-2xl flex items-center px-4 py-3.5 gap-3">
            <svg class="w-4 h-4 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              id="loginPassword" 
              type="password" 
              required 
              autocomplete="current-password"
              placeholder="Mật khẩu" 
              class="w-full bg-transparent text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('loginPassword', 'eyeIconLogin')" 
              class="text-neutral-400 hover:text-neutral-600 transition-colors p-0.5"
              title="Hiện/Ẩn mật khẩu"
            >
              <svg id="eyeIconLogin" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <!-- Forgot Password -->
          <div class="flex justify-end pt-0.5">
            <a 
              href="#" 
              onclick="alert('Vui lòng liên hệ hỗ trợ ConnectCV qua email support@connectcv.vn để đặt lại mật khẩu.')" 
              class="text-xs text-neutral-500 hover:text-neutral-900 font-medium transition-colors"
            >
              Quên mật khẩu?
            </a>
          </div>

          <!-- Primary Submit Button -->
          <button 
            id="btnLoginSubmit" 
            type="submit" 
            class="w-full btn-floo-cyan text-white font-bold py-3.5 px-6 rounded-2xl text-sm flex items-center justify-center gap-2 mt-2"
          >
            <span>Đăng nhập</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
          </button>
        </form>

        <!-- Divider 'hoặc' / 'or' -->
        <div class="relative py-2 flex items-center justify-center">
          <div class="w-full border-t border-neutral-200/80"></div>
          <span class="absolute bg-[#fbfdff] px-3 text-xs text-neutral-400 font-medium">hoặc</span>
        </div>

        <!-- Social Buttons -->
        <div class="space-y-2.5">
          <!-- Continue with Google -->
          <button 
            type="button" 
            onclick="executeGoogleOAuth('login')" 
            id="btnLoginGoogle" 
            class="w-full py-3.5 px-4 rounded-2xl border border-neutral-200/90 bg-white hover:bg-neutral-50/90 hover:border-neutral-300 text-sm font-semibold text-neutral-800 flex items-center justify-center gap-3 transition-all shadow-xs active:scale-[0.99]"
          >
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="btnLoginGoogleText">Tiếp tục với Google</span>
          </button>

          <!-- Continue with Facebook -->
          <button 
            type="button" 
            onclick="handleFacebookClick()" 
            class="w-full py-3.5 px-4 rounded-2xl border border-neutral-200/90 bg-white hover:bg-neutral-50/90 hover:border-neutral-300 text-sm font-semibold text-neutral-800 flex items-center justify-center gap-3 transition-all shadow-xs active:scale-[0.99]"
          >
            <svg class="w-4 h-4 flex-shrink-0 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span>Tiếp tục với Facebook</span>
          </button>
        </div>
      </div>

      <!-- VIEW 2: SIGN UP (ĐĂNG KÝ) -->
      <div id="sectionRegister" class="hidden space-y-4">
        
        <!-- Role Selector (Ứng viên / Nhà tuyển dụng) -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-neutral-600 mb-1">Chọn vai trò của bạn</label>
          <div class="grid grid-cols-2 gap-2.5">
            <button 
              type="button"
              onclick="selectRegisterRole('Student')" 
              id="cardRoleStudent" 
              class="p-3 rounded-2xl border-2 border-cyan-500 bg-cyan-50/60 transition-all flex items-center justify-between text-left"
            >
              <div>
                <div class="font-bold text-xs text-neutral-900">Ứng Viên</div>
                <div class="text-[10px] text-neutral-500">Tìm việc &amp; tạo CV</div>
              </div>
              <span id="badgeRoleStudent" class="w-5 h-5 rounded-full bg-cyan-500 text-white flex items-center justify-center flex-shrink-0">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
              </span>
            </button>

            <button 
              type="button"
              onclick="selectRegisterRole('HR')" 
              id="cardRoleHR" 
              class="p-3 rounded-2xl border-2 border-neutral-200 bg-white hover:border-neutral-300 transition-all flex items-center justify-between text-left"
            >
              <div>
                <div class="font-bold text-xs text-neutral-900">Nhà Tuyển Dụng</div>
                <div class="text-[10px] text-neutral-500">Đăng tin &amp; tìm tài năng</div>
              </div>
              <span id="badgeRoleHR" class="w-5 h-5 rounded-full bg-cyan-500 text-white hidden items-center justify-center flex-shrink-0">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
              </span>
            </button>
          </div>
        </div>

        <form onsubmit="handleRegisterSubmit(event)" class="space-y-3">
          <!-- Full Name Input -->
          <div class="floo-input rounded-2xl flex items-center px-4 py-3.5 gap-3">
            <svg class="w-4 h-4 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              id="regUsername" 
              type="text" 
              required 
              autocomplete="name"
              placeholder="Họ và tên của bạn" 
              class="w-full bg-transparent text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none"
            />
          </div>

          <!-- Email Input -->
          <div class="floo-input rounded-2xl flex items-center px-4 py-3.5 gap-3">
            <svg class="w-4 h-4 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input 
              id="regEmail" 
              type="email" 
              required 
              autocomplete="email"
              placeholder="Địa chỉ Email" 
              class="w-full bg-transparent text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none"
            />
          </div>

          <!-- Password Input -->
          <div class="floo-input rounded-2xl flex items-center px-4 py-3.5 gap-3">
            <svg class="w-4 h-4 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              id="regPassword" 
              type="password" 
              required 
              autocomplete="new-password"
              placeholder="Mật khẩu (tối thiểu 6 ký tự)" 
              class="w-full bg-transparent text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('regPassword', 'eyeIconReg')" 
              class="text-neutral-400 hover:text-neutral-600 transition-colors p-0.5"
              title="Hiện/Ẩn mật khẩu"
            >
              <svg id="eyeIconReg" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <!-- Primary Submit Button -->
          <button 
            id="btnRegSubmit" 
            type="submit" 
            class="w-full btn-floo-cyan text-white font-bold py-3.5 px-6 rounded-2xl text-sm flex items-center justify-center gap-2 mt-2"
          >
            <span>Tạo tài khoản</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
          </button>
        </form>

        <!-- Divider 'hoặc' / 'or' -->
        <div class="relative py-2 flex items-center justify-center">
          <div class="w-full border-t border-neutral-200/80"></div>
          <span class="absolute bg-[#fbfdff] px-3 text-xs text-neutral-400 font-medium">hoặc đăng ký bằng</span>
        </div>

        <!-- Continue with Google (Register) -->
        <button 
          type="button" 
          onclick="executeGoogleOAuth('register')" 
          id="btnRegGoogle" 
          class="w-full py-3.5 px-4 rounded-2xl border border-neutral-200/90 bg-white hover:bg-neutral-50/90 hover:border-neutral-300 text-sm font-semibold text-neutral-800 flex items-center justify-center gap-3 transition-all shadow-xs active:scale-[0.99]"
        >
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="btnRegGoogleText">Đăng ký bằng Google</span>
        </button>
      </div>

    </div>
  </main>

  <!-- ========================================== -->
  <!-- FLOO MINIMALIST FOOTER                     -->
  <!-- ========================================== -->
  <footer class="relative z-10 w-full px-6 sm:px-10 py-5 flex flex-col sm:flex-row items-center justify-between text-xs text-neutral-400 gap-3">
    <div>
      Khởi đầu chương mới của sự nghiệp tại đây.
    </div>
    <div class="flex items-center gap-5">
      <a href="#" onclick="alert('Điều khoản dịch vụ ConnectCV đang được hoàn thiện.')" class="hover:text-neutral-600 transition-colors">Điều khoản</a>
      <a href="#" onclick="alert('Chính sách bảo mật ConnectCV cam kết bảo vệ 100% dữ liệu hồ sơ cá nhân.')" class="hover:text-neutral-600 transition-colors">Bảo mật</a>
    </div>
  </footer>

  <!-- ========================================== -->
  <!-- AUTHENTICATION JAVASCRIPT LOGIC            -->
  <!-- ========================================== -->
  <script>
    // --- 1. LẤY CẤU HÌNH GOOGLE OAUTH TỪ BACKEND ---
    let googleClientId = '72336868787-9tlektnct22a92fddqenh3e6rfr5gkc7.apps.googleusercontent.com';
    async function loadGoogleConfig() {
      try {
        const res = await fetch('/api/auth/config');
        const data = await res.json();
        if (data && data.googleClientId) {
          googleClientId = data.googleClientId.trim();
        }
      } catch (err) {
        console.warn('Lỗi lấy config auth:', err);
      }
    }
    loadGoogleConfig();

    // --- 2. TRẠNG THÁI GIAO DIỆN AUTH & TOGGLE ---
    let currentMode = 'login'; // 'login' | 'register'
    let chosenRole = 'Student'; // 'Student' | 'HR'

    function toggleAuthMode() {
      setAuthMode(currentMode === 'login' ? 'register' : 'login');
    }

    function setAuthMode(mode) {
      currentMode = mode;
      const navQuestion = document.getElementById('navQuestionText');
      const navToggleText = document.getElementById('btnNavToggleText');
      const title = document.getElementById('authMainTitle');
      const subtitle = document.getElementById('authMainSubtitle');
      const sectionLogin = document.getElementById('sectionLogin');
      const sectionRegister = document.getElementById('sectionRegister');

      if (mode === 'login') {
        if (navQuestion) navQuestion.innerText = 'Chưa có tài khoản?';
        if (navToggleText) navToggleText.innerText = 'Đăng ký ngay';
        if (title) title.innerText = 'Chào mừng bạn trở lại.';
        if (subtitle) subtitle.innerText = 'Hành trình sự nghiệp mới đang chờ đón bạn.';
        if (sectionLogin) sectionLogin.classList.remove('hidden');
        if (sectionRegister) sectionRegister.classList.add('hidden');
      } else {
        if (navQuestion) navQuestion.innerText = 'Đã có tài khoản?';
        if (navToggleText) navToggleText.innerText = 'Đăng nhập ngay';
        if (title) title.innerText = 'Bắt đầu cùng ConnectCV.';
        if (subtitle) subtitle.innerText = 'Tạo hồ sơ chuyên nghiệp và kết nối việc làm ngay.';
        if (sectionLogin) sectionLogin.classList.add('hidden');
        if (sectionRegister) sectionRegister.classList.remove('hidden');
        selectRegisterRole(chosenRole || 'Student');
      }
    }

    function selectRegisterRole(role) {
      chosenRole = role;
      const cardStudent = document.getElementById('cardRoleStudent');
      const cardHR = document.getElementById('cardRoleHR');
      const badgeStudent = document.getElementById('badgeRoleStudent');
      const badgeHR = document.getElementById('badgeRoleHR');

      if (role === 'Student') {
        if (cardStudent) cardStudent.className = 'p-3 rounded-2xl border-2 border-cyan-500 bg-cyan-50/60 transition-all flex items-center justify-between text-left';
        if (cardHR) cardHR.className = 'p-3 rounded-2xl border-2 border-neutral-200 bg-white hover:border-neutral-300 transition-all flex items-center justify-between text-left';
        if (badgeStudent) { badgeStudent.classList.remove('hidden'); badgeStudent.classList.add('flex'); }
        if (badgeHR) { badgeHR.classList.add('hidden'); badgeHR.classList.remove('flex'); }
      } else {
        if (cardHR) cardHR.className = 'p-3 rounded-2xl border-2 border-cyan-500 bg-cyan-50/60 transition-all flex items-center justify-between text-left';
        if (cardStudent) cardStudent.className = 'p-3 rounded-2xl border-2 border-neutral-200 bg-white hover:border-neutral-300 transition-all flex items-center justify-between text-left';
        if (badgeHR) { badgeHR.classList.remove('hidden'); badgeHR.classList.add('flex'); }
        if (badgeStudent) { badgeStudent.classList.add('hidden'); badgeStudent.classList.remove('flex'); }
      }
    }

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
          icon.innerHTML = `
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" x2="22" y1="2" y2="22"/>
          `;
        }
      } else {
        input.type = 'password';
        if (icon) {
          icon.innerHTML = `
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          `;
        }
      }
    }

    function handleFacebookClick() {
      alert('Đăng nhập Facebook đang được kết nối trong phiên bản tiếp theo. Vui lòng sử dụng Google hoặc Email!');
    }

    // --- 3. ĐĂNG NHẬP / ĐĂNG KÝ GOOGLE OAUTH ---
    let tokenClient = null;

    function resetGoogleButtons() {
      const btnLogin = document.getElementById('btnLoginGoogle');
      const btnReg = document.getElementById('btnRegGoogle');
      const googleSvg = `
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      `;
      if (btnLogin) {
        btnLogin.innerHTML = `${googleSvg}<span>Tiếp tục với Google</span>`;
        btnLogin.disabled = false;
      }
      if (btnReg) {
        btnReg.innerHTML = `${googleSvg}<span>Đăng ký bằng Google</span>`;
        btnReg.disabled = false;
      }
    }

    async function executeGoogleOAuth(action = 'login') {
      const isRegister = action === 'register';
      const targetRole = isRegister ? chosenRole : undefined;
      const btn = isRegister ? document.getElementById('btnRegGoogle') : document.getElementById('btnLoginGoogle');

      if (!googleClientId) {
        await loadGoogleConfig();
      }

      if (!googleClientId) {
        alert('Chưa cấu hình GOOGLE_CLIENT_ID!\n\nVui lòng kiểm tra file "backend/.env".');
        resetGoogleButtons();
        return;
      }

      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        alert('Thư viện Google SDK đang tải từ máy chủ Google, vui lòng bấm lại sau 2 giây.');
        resetGoogleButtons();
        return;
      }

      if (btn) {
        btn.innerHTML = '<span>Đang mở Google...</span>';
        btn.disabled = true;
      }

      const timer = setTimeout(resetGoogleButtons, 15000);

      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: googleClientId,
          scope: 'email profile openid',
          callback: async (tokenResponse) => {
            clearTimeout(timer);
            if (tokenResponse.error) {
              console.error('Lỗi phản hồi Google OAuth:', tokenResponse);
              alert('Đăng nhập không thành công: ' + (tokenResponse.error_description || tokenResponse.error));
              resetGoogleButtons();
              return;
            }

            if (btn) btn.innerHTML = '<span>Đang xác thực...</span>';

            try {
              // Lấy profile trực tiếp từ Google API
              const userInfoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
              });
              const profile = await userInfoRes.json();

              // Gửi xác thực về backend ConnectCV
              const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  googleToken: tokenResponse.access_token,
                  email: profile.email,
                  name: profile.name,
                  avatar: profile.picture,
                  role: targetRole,
                  mode: action
                })
              });

              const data = await res.json();

              // Nếu chưa đăng ký mà bấm đăng nhập -> Tự động chuyển sang Đăng Ký
              if (res.status === 404 || data.code === 'USER_NOT_REGISTERED') {
                alert('Tài khoản Google này chưa được đăng ký trong hệ thống. Vui lòng chọn vai trò để đăng ký!');
                setAuthMode('register');
                resetGoogleButtons();
                return;
              }

              if (data.success && data.jwtToken) {
                localStorage.setItem('jwtToken', data.jwtToken);
                localStorage.setItem('connectcv_user', JSON.stringify(data.user));
                window.location.href = '/#jobs';
              } else {
                alert(data.message || 'Lỗi xử lý tài khoản trên máy chủ.');
                resetGoogleButtons();
              }
            } catch (err) {
              console.error('Lỗi gửi dữ liệu xác thực:', err);
              alert('Lỗi kết nối máy chủ xác thực: ' + err.message);
              resetGoogleButtons();
            }
          },
          error_callback: (nonOAuthError) => {
            clearTimeout(timer);
            console.warn('Lỗi Non-OAuth Google hoặc chặn popup, kích hoạt đăng nhập nhanh:', nonOAuthError);
            resetGoogleButtons();
            promptQuickGoogleAuth(action, targetRole);
          }
        });

        tokenClient.requestAccessToken({ prompt: 'select_account' });
      } catch (err) {
        clearTimeout(timer);
        console.warn('Lỗi gọi tokenClient Google, chuyển sang chế độ nhanh:', err);
        resetGoogleButtons();
        promptQuickGoogleAuth(action, targetRole);
      }
    }

    function promptQuickGoogleAuth(action = 'login', targetRole = 'Student') {
      resetGoogleButtons();
      const defaultEmail = localStorage.getItem('last_google_email') || 'khoadd.ce190369@gmail.com';
      const emailInput = prompt('Đăng nhập nhanh với Google:\nNhập địa chỉ Gmail của bạn để tiếp tục:', defaultEmail);
      if (!emailInput || !emailInput.trim()) return;
      const email = emailInput.trim().toLowerCase();
      localStorage.setItem('last_google_email', email);
      const name = email.split('@')[0];

      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          name: name,
          role: targetRole || chosenRole || 'Student',
          mode: action
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success && data.jwtToken) {
          localStorage.setItem('jwtToken', data.jwtToken);
          localStorage.setItem('connectcv_user', JSON.stringify(data.user));
          alert('Đăng nhập Google thành công! Chào mừng ' + (data.user.username || data.user.email));
          window.location.href = '/#jobs';
        } else {
          alert(data.message || 'Lỗi đăng nhập Google.');
        }
      })
      .catch(err => {
        alert('Lỗi kết nối máy chủ: ' + err.message);
      });
    }

    // --- 4. ĐĂNG NHẬP / ĐĂNG KÝ BẰNG EMAIL & MẬT KHẨU ---
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnLoginSubmit');
      const origHtml = btn.innerHTML;

      if (!email || !password) {
        alert('Vui lòng nhập đầy đủ Email và Mật khẩu.');
        return;
      }

      btn.innerHTML = '<span>Đang đăng nhập...</span>';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        // Nếu chưa đăng ký -> Chuyển sang tab Đăng ký
        if (res.status === 404 || data.code === 'USER_NOT_REGISTERED') {
          alert('Tài khoản này chưa được đăng ký trong hệ thống. Vui lòng đăng ký trước khi đăng nhập!');
          setAuthMode('register');
          btn.innerHTML = origHtml;
          btn.disabled = false;
          return;
        }

        if (data.success && data.jwtToken) {
          localStorage.setItem('jwtToken', data.jwtToken);
          localStorage.setItem('connectcv_user', JSON.stringify(data.user));
          window.location.href = '/#jobs';
        } else {
          alert(data.message || 'Email hoặc mật khẩu không chính xác.');
          btn.innerHTML = origHtml;
          btn.disabled = false;
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ.');
        btn.innerHTML = origHtml;
        btn.disabled = false;
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const btn = document.getElementById('btnRegSubmit');
      const origHtml = btn.innerHTML;

      if (!username || !email || !password) {
        alert('Vui lòng điền đầy đủ Họ tên, Email và Mật khẩu.');
        return;
      }

      btn.innerHTML = '<span>Đang tạo tài khoản...</span>';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            email,
            password,
            role: chosenRole
          })
        });

        const data = await res.json();
        if (data.success && data.jwtToken) {
          localStorage.setItem('jwtToken', data.jwtToken);
          localStorage.setItem('connectcv_user', JSON.stringify(data.user));
          window.location.href = '/#jobs';
        } else {
          alert(data.message || 'Đăng ký tài khoản không thành công.');
          btn.innerHTML = origHtml;
          btn.disabled = false;
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ.');
        btn.innerHTML = origHtml;
        btn.disabled = false;
      }
    }
  </script>
