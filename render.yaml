services:
  - type: web
    name: connectcv-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: VIETQR_BANK_ID
        value: MB
      - key: VIETQR_ACCOUNT_NO
        value: "0987654321"
      - key: VIETQR_ACCOUNT_NAME
        value: "CONG TY CONNECTCV AI"
      - key: GEMINI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 72336868787-9tlektnct22a92fddqenh3e6rfr5gkc7.apps.googleusercontent.com
